function parseCsv(text){const out=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===','&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(v=>v.trim()))out.push(row);row=[]}else cell+=ch}if(cell||row.length){row.push(cell);out.push(row)}return out}
function normalizeTime(value){const m=String(value||'').match(/(\d+):(\d+)\s*([صم])/);if(!m)return value||'';let h=+m[1];if(m[3]==='م'&&h<12)h+=12;return String(h).padStart(2,'0')+':'+m[2]}
function parseMatches(rows){const header=rows.findIndex(r=>(r[0]||'').trim()==='م');return rows.slice(header+1).filter(r=>/^\d+$/.test((r[0]||'').trim())).map(r=>({id:+r[0],round:'R'+r[1],date:r[3],home:TEAM_MAP[(r[4]||'').trim()]||r[4],hs:r[5]!==''&&!isNaN(r[5])?+r[5]:null,as:r[7]!==''&&!isNaN(r[7])?+r[7]:null,away:TEAM_MAP[(r[8]||'').trim()]||r[8],time:normalizeTime(r[9]),venue:r[10]||''}))}
function logo(name,cls='logo'){return TEAM_LOGOS[name]?`<img class="${cls}" src="${TEAM_LOGOS[name]}" alt="${name} logo">`:''}
function card(m){const done=m.hs!==null&&m.as!==null;return `<article class="card match" data-match="${m.id}"><div class="meta"><span>${m.round} · ${m.date}</span><span dir="rtl">${m.venue}</span></div><div class="teams"><div class="team"><span>${m.home}</span>${logo(m.home)}</div><div class="score-chip">${done?m.hs+' - '+m.as:(m.time||'TBD')}</div><div class="team">${logo(m.away)}<span>${m.away}</span></div></div></article>`}
function standings(source=matches){const o={};TEAMS.forEach(team=>o[team]={team,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,form:[]});source.forEach(m=>{if(m.hs===null||m.as===null||!o[m.home]||!o[m.away])return;const h=o[m.home],a=o[m.away];h.p++;a.p++;h.gf+=m.hs;h.ga+=m.as;a.gf+=m.as;a.ga+=m.hs;if(m.hs>m.as){h.w++;h.pts+=2;a.l++;h.form.push('W');a.form.push('L')}else if(m.hs<m.as){a.w++;a.pts+=2;h.l++;a.form.push('W');h.form.push('L')}else{h.d++;a.d++;h.pts++;a.pts++;h.form.push('D');a.form.push('D')}});return Object.values(o).sort((a,b)=>b.pts-a.pts||((b.gf-b.ga)-(a.gf-a.ga))||b.gf-a.gf)}
function positionChanges(table){
 const completed=matches.filter(m=>m.hs!==null&&m.as!==null);
 const latestCompleted=completed[completed.length-1];
 if(!latestCompleted)return Object.fromEntries(table.map(t=>[t.team,{html:'<span class="move same">＝</span>',label:'No previous matchday'}]));
 const lastMatchday=latestCompleted.date;
 const lastMatchdayIds=new Set(completed.filter(m=>m.date===lastMatchday).map(m=>m.id));
 const before=standings(matches.filter(m=>!lastMatchdayIds.has(m.id)));
 const previousPositions=Object.fromEntries(before.map((t,i)=>[t.team,i+1]));
 return Object.fromEntries(table.map((t,i)=>{
  const current=i+1,previous=previousPositions[t.team];
  if(!previous||previous===current)return [t.team,{html:'<span class="move same">＝</span>',label:`No position change after the ${lastMatchday} matchday`}];
  if(previous>current){const n=previous-current;return [t.team,{html:`<span class="move up">▲${n}</span>`,label:`Moved up ${n} position${n===1?'':'s'} after the ${lastMatchday} matchday`}];}
  const n=current-previous;return [t.team,{html:`<span class="move down">▼${n}</span>`,label:`Moved down ${n} position${n===1?'':'s'} after the ${lastMatchday} matchday`}];
 }));
}
const form=x=>x.slice(-5).map(v=>`<span class="pill ${v}">${v}</span>`).join('')||'-';
function upcomingGame(){return matches.find(m=>(m.home===SETTINGS.champion||m.away===SETTINGS.champion)&&m.hs===null)}
function render(){const table=standings(),movement=positionChanges(table),pos=table.findIndex(x=>x.team===SETTINGS.champion),c=table[pos]||{pts:0,p:0,gf:0,ga:0,form:[]};const qualified=pos>=0&&pos<3,third=table[2]||{pts:0,gf:0,ga:0},pointsToQualify=Math.max(0,third.pts-c.pts),goalsToQualify=Math.max(0,(third.gf-third.ga)-(c.gf-c.ga));const qualificationDetail=qualified?`Position ${pos+1} · Top 3 qualify`:pointsToQualify>0?`Need ${pointsToQualify} point${pointsToQualify===1?'':'s'} to match P3`:`Need ${goalsToQualify} goal${goalsToQualify===1?'':'s'} in goal difference`;$('kpis').innerHTML=`<div class="card kpi"><label>Position</label><strong>${pos+1}</strong><small>Group 1</small></div><div class="card kpi"><label>Points</label><strong>${c.pts}</strong><small>${c.p} played</small></div><div class="card kpi"><label>Goal Difference</label><strong>${c.gf-c.ga>0?'+':''}${c.gf-c.ga}</strong><small>${c.gf} GF · ${c.ga} GA</small></div><div class="card kpi"><label>Recent Form</label><div>${form(c.form)}</div><small>Last matches</small></div><div class="card kpi"><label>Qualification</label><strong>${qualified?'✅ QUALIFIED':'❌ NOT QUALIFIED'}</strong><small>${pos>=0?qualificationDetail:'Position unavailable'}</small></div>`;const next=upcomingGame();$('next').innerHTML=next?card(next):'<div class="card kpi">No upcoming fixture</div>';$('latest').innerHTML=matches.filter(m=>m.hs!==null).slice(-4).reverse().map(card).join('');$('champMatches').innerHTML=matches.filter(m=>m.home===SETTINGS.champion||m.away===SETTINGS.champion).map(card).join('');renderFiltered();$('standingBody').innerHTML=table.map((t,i)=>`<tr class="${t.team===SETTINGS.champion?'champ':''}"><td>${i+1}</td><td title="${movement[t.team].label}" aria-label="${movement[t.team].label}">${movement[t.team].html}</td><td class="name"><div class="standing">${logo(t.team)}<strong>${t.team}</strong></div></td><td>${t.p}</td><td>${t.w}</td><td>${t.d}</td><td>${t.l}</td><td>${t.gf}</td><td>${t.ga}</td><td>${t.gf-t.ga>0?'+':''}${t.gf-t.ga}</td><td>${form(t.form)}</td><td><strong>${t.pts}</strong></td></tr>`).join('');configureScoreboard(next)}
function renderFiltered(){const q=$('search').value.toLowerCase(),r=$('round').value;$('matches').innerHTML=matches.filter(m=>(r==='ALL'||m.round===r)&&(m.home+m.away+m.venue).toLowerCase().includes(q)).map(card).join('')}
async function loadData(){const st=$('status');st.textContent='Syncing Google Sheets';try{const res=await fetch(SETTINGS.googleSheetCsv+(SETTINGS.googleSheetCsv.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);matches=parseMatches(parseCsv(await res.text()));if(!matches.length)throw new Error('No match rows');localStorage.setItem('champData',JSON.stringify(matches));render();st.textContent='Live · Updated '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}catch(err){const saved=localStorage.getItem('champData');if(saved){matches=JSON.parse(saved);render();st.textContent='Offline · Saved Google Sheets data'}else st.textContent='Unable to load Google Sheets data'}}

async function showMatchSummaryImage(){
 try{const canvas=await createSummaryPhoto();summaryImageUrl=canvas.toDataURL('image/png');$('modalTitle').textContent='Match Summary';$('modalBody').innerHTML=`<div class="summary-photo-wrap"><img class="summary-photo" src="${summaryImageUrl}" alt="Match summary graphic"><div class="summary-actions"><button class="tool" id="saveSummary">📸 Save Image</button><button class="tool" id="shareSummary">↗ Share Image</button></div></div>`;$('modal').querySelector('.modal-box').classList.add('summary-modal');$('modal').classList.add('open');$('saveSummary').onclick=downloadSummary;$('shareSummary').onclick=shareSummary}catch(e){toast('Unable to create summary image')}
}
function downloadSummary(){if(!summaryImageUrl)return;const a=document.createElement('a');a.href=summaryImageUrl;a.download=`${$('homeTeam').value}-vs-${$('awayTeam').value}-summary.png`.replace(/[^a-z0-9.-]+/gi,'-');a.click()}
async function shareSummary(){if(!summaryImageUrl)return;try{const blob=await(await fetch(summaryImageUrl)).blob();const file=new File([blob],'match-summary.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Match Summary'})}else downloadSummary()}catch(e){downloadSummary()}}
async function wake(){try{if('wakeLock'in navigator&&!score.wake)score.wake=await navigator.wakeLock.request('screen')}catch(e){}}
async function releaseWake(){try{if(score.wake){await score.wake.release();score.wake=null}}catch(e){}}
function stopClock(){score.running=false;clearInterval(score.timer);score.timer=null;releaseWake();renderScore()}
function toggleClock(){if(score.running)return stopClock();if(score.finished||score.remaining<=0)return;score.running=true;wake();renderScore();score.timer=setInterval(()=>{score.remaining=Math.max(0,score.remaining-1);tickEjections();if(score.remaining===0){stopClock();if(score.period<PERIODS.length-1){score.period++;score.remaining=PERIODS[score.period].seconds;toast(PERIODS[score.period].name+' ready')}else{score.finished=true;toast('MATCH FINISHED');setTimeout(showMatchSummaryImage,350)}}renderScore()},1000)}
function adjustMinute(delta){score.remaining=Math.max(0,Math.min(PERIODS[score.period].seconds,score.remaining+delta*60));renderScore();toast(delta>0?'One minute added':'One minute removed')}
function fillTeams(){['homeTeam','awayTeam'].forEach(id=>$(id).innerHTML=TEAMS.map(t=>`<option value="${t}">${t}</option>`).join(''))}
function updateSide(side,name){if(name)$(side+'Team').value=name;const team=$(side+'Team').value;$(side+'Logo').src=TEAM_LOGOS[team]||'icon-192.png';$(side+'Logo').alt=team+' logo';if(team===SETTINGS.champion)setScoreColor(side,'#374151')}
function configureScoreboard(game){fillTeams();updateSide('home',game?game.home:SETTINGS.champion);updateSide('away',game?game.away:'Maadi')}
async function toggleFullscreen(){const el=$('scoreboardApp');try{const active=document.fullscreenElement||document.webkitFullscreenElement;if(active){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)await exit.call(document)}else{const request=el.requestFullscreen||el.webkitRequestFullscreen;if(request)await request.call(el);else toast('Fullscreen unavailable')}}catch(e){toast('Fullscreen unavailable')}}
function fullscreenState(){const active=!!(document.fullscreenElement||document.webkitFullscreenElement);$('fullscreenBtn').textContent=active?'⛶ Exit Fullscreen':'⛶ Fullscreen'}
const APP_THEMES={red:'#b7182a',blue:'#1769d2',green:'#07845f',purple:'#7c3aed',orange:'#ea580c',black:'#111827'};function applyAppTheme(name){if(!APP_THEMES[name])name='red';document.documentElement.style.setProperty('--brand',APP_THEMES[name]);document.body.style.setProperty('--brand',APP_THEMES[name]);$('appTheme').value=name;localStorage.setItem('appTheme',name)}function setScoreColor(side,color){document.documentElement.style.setProperty(side==='home'?'--homeScoreColor':'--awayScoreColor',color);document.querySelectorAll(`.color-dot[data-side="${side}"]`).forEach(b=>b.classList.toggle('active',b.dataset.color.toLowerCase()===color.toLowerCase()));localStorage.setItem(side+'ScoreColor',color)}
document.addEventListener('click',e=>{const tab=e.target.closest('.tab');if(tab)switchTab(tab.dataset.tab);const match=e.target.closest('[data-match]');if(match)openMatch(+match.dataset.match)});$('search').addEventListener('input',renderFiltered);$('round').addEventListener('change',renderFiltered);$('refreshBtn').onclick=loadData;$('themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark')?'1':'0')};$('modalClose').onclick=()=>{document.getElementById('modal').classList.remove('open');$('modal').querySelector('.modal-box').classList.remove('summary-modal')};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};function addGoal(side){if(!score.running){toast('Start the clock before adding a goal');return}score[side]++;matchSummary.periods[score.period][side]++;renderScore()}function removeGoal(side){if(score[side]<=0||matchSummary.periods[score.period][side]<=0){toast('No goal to cancel in this period');return}score[side]--;matchSummary.periods[score.period][side]--;renderScore();toast('Goal cancelled')}$('homeEjectPlus').onclick=()=>{score.homeEjections.push(120);renderScore();toast('Home 2-minute timer started')};$('homeEjectMinus').onclick=()=>{if(score.homeEjections.length)score.homeEjections.pop();renderScore();toast('Home ejection removed')};$('awayEjectPlus').onclick=()=>{score.awayEjections.push(120);renderScore();toast('Away 2-minute timer started')};$('awayEjectMinus').onclick=()=>{if(score.awayEjections.length)score.awayEjections.pop();renderScore();toast('Away ejection removed')};$('homeGoal').onclick=()=>addGoal('home');$('awayGoal').onclick=()=>addGoal('away');$('homeMinus').onclick=()=>removeGoal('home');$('awayMinus').onclick=()=>removeGoal('away');$('clockControl').onclick=toggleClock;$('minusMinute').onclick=()=>adjustMinute(-1);$('plusMinute').onclick=()=>adjustMinute(1);$('resetScore').onclick=()=>{stopClock();score.home=0;score.away=0;score.homeEjections=[];score.awayEjections=[];score.period=0;score.remaining=PERIODS[0].seconds;score.finished=false;matchSummary.periods=PERIODS.map(()=>({home:0,away:0}));summaryImageUrl='';renderScore();toast('Scoreboard reset')};$('homeTeam').onchange=()=>updateSide('home');$('awayTeam').onchange=()=>updateSide('away');$('appTheme').onchange=e=>applyAppTheme(e.target.value);document.querySelectorAll('.color-dot').forEach(b=>b.onclick=()=>setScoreColor(b.dataset.side,b.dataset.color));$('fullscreenBtn').onclick=toggleFullscreen;document.addEventListener('fullscreenchange',fullscreenState);document.addEventListener('webkitfullscreenchange',fullscreenState);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&score.running)wake()});
for(let i=1;i<=14;i++)$('round').insertAdjacentHTML('beforeend',`<option value="R${i}">Round ${i}</option>`);if(localStorage.getItem('dark')==='1')document.body.classList.add('dark');applyAppTheme(localStorage.getItem('appTheme')||'red');setScoreColor('home',localStorage.getItem('homeScoreColor')||'#374151');setScoreColor('away',localStorage.getItem('awayScoreColor')||'#ffd34f');renderScore();configureScoreboard();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));loadData();
